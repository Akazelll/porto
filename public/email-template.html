<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Message — Akazell Portfolio</title>
  <style>
    @media only screen and (max-width: 600px) {
      .email-wrapper  { padding: 20px 8px !important; }
      .email-card     { border-radius: 12px !important; }
      .card-body      { padding: 24px 20px !important; }
      .sender-name    { font-size: 14px !important; }
      .sender-email   { font-size: 12px !important; }
      .heading        { font-size: 18px !important; }
      .reply-btn      { display: block !important; width: 100% !important; text-align: center !important; box-sizing: border-box !important; }
      .reply-td       { display: block !important; width: 100% !important; border-radius: 8px !important; }
      .time-cell      { display: none !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f0f4f2;font-family:Arial,Helvetica,sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4f2;padding:40px 16px;" class="email-wrapper">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">

          <!-- header -->
          <tr>
            <td style="padding-bottom:24px;text-align:center;">
              <span style="font-size:22px;font-weight:700;color:#15171B;letter-spacing:-0.5px;">
                Akazell<span style="color:#0B6E4F;">.</span>
              </span>
            </td>
          </tr>

          <!-- card -->
          <tr>
            <td style="background-color:#ffffff;border-radius:16px;border:1px solid #d4e6de;overflow:hidden;" class="email-card">

              <!-- card top accent bar -->
              <tr>
                <td style="height:4px;background:linear-gradient(to right,#0B6E4F,#34d399);display:block;line-height:4px;font-size:4px;">&nbsp;</td>
              </tr>

              <!-- card body -->
              <tr>
                <td style="padding:32px 36px;" class="card-body">

                  <!-- label -->
                  <p style="margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#0B6E4F;">
                    New Message
                  </p>

                  <!-- heading -->
                  <h1 style="margin:0 0 28px;font-size:22px;font-weight:700;color:#15171B;line-height:1.3;" class="heading">
                    You received a message from your portfolio.
                  </h1>

                  <!-- divider -->
                  <div style="height:1px;background-color:#e8f3ef;margin-bottom:28px;"></div>

                  <!-- sender row -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
                    <tr>
                      <!-- avatar -->
                      <td style="width:44px;vertical-align:top;">
                        <div style="width:44px;height:44px;border-radius:50%;background-color:#e8f3ef;border:2px solid #b8ddd0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:44px;">
                          <span style="font-size:18px;color:#0B6E4F;font-weight:700;">
                            {{user_name}}
                          </span>
                        </div>
                      </td>
                      <td style="padding-left:14px;vertical-align:top;">
                        <p style="margin:0;font-size:15px;font-weight:600;color:#15171B;" class="sender-name">{{user_name}}</p>
                        <p style="margin:2px 0 0;font-size:13px;color:#6B7178;" class="sender-email">{{user_email}}</p>
                      </td>
                      <td style="text-align:right;vertical-align:top;" class="time-cell">
                        <p style="margin:0;font-size:11px;color:#6B7178;font-family:monospace;letter-spacing:0.04em;">{{time}}</p>
                      </td>
                    </tr>
                  </table>

                  <!-- message box -->
                  <div style="background-color:#f7fbf9;border:1px solid #d4e6de;border-left:3px solid #0B6E4F;border-radius:8px;padding:20px 20px 20px 18px;">
                    <p style="margin:0 0 6px;font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#0B6E4F;">Message</p>
                    <p style="margin:0;font-size:15px;color:#2c3e50;line-height:1.7;white-space:pre-wrap;">{{message}}</p>
                  </div>

                  <!-- divider -->
                  <div style="height:1px;background-color:#e8f3ef;margin:28px 0;"></div>

                  <!-- reply CTA -->
                  <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="border-radius:8px;background-color:#0B6E4F;" class="reply-td">
                        <a href="mailto:{{user_email}}"
                           style="display:inline-block;padding:11px 24px;font-size:13px;font-weight:600;color:#ffffff;text-decoration:none;letter-spacing:0.02em;"
                           class="reply-btn">
                          Reply to {{user_name}} →
                        </a>
                      </td>
                    </tr>
                  </table>

                </td>
              </tr>

            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding-top:24px;text-align:center;">
              <p style="margin:0;font-size:11px;color:#6B7178;line-height:1.6;">
                This message was sent via the contact form on
                <a href="https://akazelll.my.id" style="color:#0B6E4F;text-decoration:none;">akazelll.my.id</a>
              </p>
              <p style="margin:6px 0 0;font-size:11px;color:#9ca3af;">
                © 2026 Adam Raga · Akazell
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
